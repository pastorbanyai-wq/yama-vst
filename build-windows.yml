name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64, Release)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/KeyboardWorkstation_artefacts/Release/VST3/*" dist/
          Copy-Item "build/KeyboardWorkstation_artefacts/Release/Standalone/*.exe" dist/
          Copy-Item install.ps1 dist/
          Get-ChildItem -Recurse dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardWorkstation-Windows-x64
          path: dist/
