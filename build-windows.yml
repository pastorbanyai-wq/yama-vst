name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64, Release)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/KeyboardWorkstation_artefacts/Release/VST3/*" dist/
          Copy-Item "build/KeyboardWorkstation_artefacts/Release/Standalone/*.exe" dist/
          Copy-Item install.ps1 dist/
          Get-ChildItem -Recurse dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardWorkstation-Windows-x64
          path: dist/
- name: tauri-build
  # You may pin to the exact commit or the version.
  # uses: JonasKruckenberg/tauri-build@406f9292d464c04add8c74e8ed1ed4105b91a20e
  uses: JonasKruckenberg/tauri-build@v1.0.3
  with:
    # Binary to use to build the application
    runner: # optional
    # Additional arguments for the build command
    args: # optional
    # Path to the root of the project
    projectPath: # optional
    # Path to the tauri.conf.json file if you want a configuration different from the default one
    configPath: # optional
    # The target triple to build against
    target: # optional
    # Builds with the debug flag
    debug: # optional
    
